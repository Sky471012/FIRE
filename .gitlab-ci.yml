# GitLab CI/CD Configuration for Tauri Application

# Define pipeline stages
stages:
  - lint
  - build
  - security

# Global cache configuration
variables:
  PNPM_STORE_PATH: ${CI_PROJECT_DIR}/.pnpm-store

# Cache definitions
.pnpm_cache: &pnpm_cache
  cache:
    key: pnpm-${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store/
      - node_modules/

# Lint Frontend

lint:frontend:
  stage: lint
  image: node:20
  <<: *pnpm_cache
  before_script:
    # Enable pnpm via corepack
    - corepack enable
    - corepack prepare pnpm@latest --activate
    # Configure pnpm store path
    - pnpm config set store-dir ${PNPM_STORE_PATH}
  script:
    # Install dependencies
    - pnpm install --frozen-lockfile
    # Run linting
    - pnpm run lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Build Frontend

build:frontend:
  stage: build
  image: node:20
  <<: *pnpm_cache
  before_script:
    # Enable pnpm via corepack
    - corepack enable
    - corepack prepare pnpm@latest --activate
    # Configure pnpm store path
    - pnpm config set store-dir ${PNPM_STORE_PATH}
  script:
    # Install dependencies with frozen lockfile
    - pnpm install --frozen-lockfile
    # Build the Next.js application
    - pnpm run build
  artifacts:
    paths:
      - .next/
      - out/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Security (SAST)
include:
  - template: Security/SAST.gitlab-ci.yml
