stages:
  - pages
  - release

variables:
  PNPM_STORE_PATH: ${CI_PROJECT_DIR}/.pnpm-store

pages:
  stage: pages
  image: node:20
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - landing/.pnpm-store/
      - landing/node_modules/
  before_script:
    - corepack enable
    - cd landing
    - pnpm config set store-dir ${PNPM_STORE_PATH}
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build
    - mkdir -p ../public
    - cp -r out/* ../public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - landing/**/*

release-app:
  stage: release
  image: node:20
  cache:
    key: ${CI_COMMIT_REF_SLUG}-app
    paths:
      - .pnpm-store/
      - node_modules/
      - src-tauri/target/
  before_script:
    - apt-get update
    - apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
    - apt-get install -y nsis mingw-w64
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source "$HOME/.cargo/env"
    - rustup target add x86_64-pc-windows-gnu
    - corepack enable
    - pnpm config set store-dir ${PNPM_STORE_PATH}
  script:
    - pnpm install --frozen-lockfile
    - pnpm tauri build --target x86_64-pc-windows-gnu
  artifacts:
    paths:
      - src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
    expire_in: 1 week
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG'
  rules:
    - if: $CI_COMMIT_TAG
