stages:
  - pages
  - release

variables:
  PNPM_STORE_PATH: ${CI_PROJECT_DIR}/.pnpm-store

pages:
  stage: pages
  image: node:20
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - landing/.pnpm-store/
      - landing/node_modules/
  before_script:
    - corepack enable
    - cd landing
    - pnpm config set store-dir ${PNPM_STORE_PATH}
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build
    - mkdir -p ../public
    - cp -r out/* ../public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - landing/**/*

release-app:
  stage: release
  tags:
    - saas-windows-medium-amd64
  variables:
    ErrorActionPreference: STOP
  cache:
    key: ${CI_COMMIT_REF_SLUG}-app-win
    paths:
      - .pnpm-store/
      - node_modules/
      - src-tauri/target/
  before_script:
    - Write-Host "Setting up Windows Environment..."
    - choco install nodejs -y --force
    - choco install rust -y --force
    - choco install llvm -y --force # Often needed for bindgen/C-interop
    - npm install -g pnpm
    - pnpm config set store-dir ${PNPM_STORE_PATH}
    - refreshenv
    - node --version
    - cargo --version
  script:
    - pnpm install --frozen-lockfile
    - pnpm tauri build # Target is implied as native Windows
  artifacts:
    paths:
      - src-tauri/target/release/bundle/nsis/*.exe
    expire_in: 1 week
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG'
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
