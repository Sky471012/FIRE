stages:
  - build

variables:
  PNPM_STORE_PATH: ${CI_PROJECT_DIR}/.pnpm-store

build:
  stage: build
  image: node:20
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store/
      - node_modules/
  before_script:
    - corepack enable
    - pnpm config set store-dir ${PNPM_STORE_PATH}
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 day
