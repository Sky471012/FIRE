[package]
name = "fire"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.12.2"
calamine = { version = "0.31.0", features = ["chrono"] }
netcdf = { version = "0.11.1"}
once_cell = "1.19"
chrono = "0.4"
dirs = "6.0.0"
anyhow = "1.0.100"
toml = { version = "0.9.8", features = ["preserve_order"] }
uuid = { version = "1.18.1", features = ["v4"] }
reqwest = { version = "0.12.24", features = ["json"] }
duckdb = {version = "1.4.1", default-features = false}
coding = "0.1.0"
zip = "6.0.0"
urlencoding = "2.1.3"
sysinfo = "0.32.0"
# AWS and Auth dependencies
tokio = { version = "1", features = ["full"] }
aws-config = "1.5"
aws-sdk-cognitoidentityprovider = "1.50"
aws-sdk-dynamodb = "1.50"
keyring = "3.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
incremental = true
codegen-units = 16
debug = true
opt-level = 0

